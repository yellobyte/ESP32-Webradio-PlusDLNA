; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;cache_dir = C:/Users/name/.platformio/.cache
; default env(s) to be built
default_envs = release
;default_envs = debug

; Custom data group
; can be use in [env:***] via ${common.***}
[common]

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
; Disable dynamic toolchain configuration for upstream Arduino packages
; board_build.arduino.upstream_packages = no
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_port = COM[345678]
monitor_filters = esp32_exception_decoder, time
;monitor_rts = 0
;monitor_dtr = 0
;monitor_flags = 
upload_port = COM[345678]
upload_speed = 921600
lib_deps = 
  Adafruit BusIO
  Ethernet@2.0.2
  Adafruit ST7735 and ST7789 Library
  SoapESP32
  Timezone
;lib_ldf_mode = chain+
;lib_ldf_mode = deep+
build_flags = 
; 0 no debug output, 1 errors, 2 warnings, 3 infos, 4 debug info, 5 verbose   
  -DCORE_DEBUG_LEVEL=3
; needed for strcasestr (string.h)
;  -D__GNU_VISIBLE
  -DUSE_ETHERNET
;build_unflags =
;  -fno-rtti
;  -Os
;  -O2
; 1) Switch between built-in tables
; https://github.com/espressif/arduino-esp32/tree/master/tools/partitions
; https://github.com/espressif/esp-idf/tree/master/components/partition_table
board_build.partitions = min_spiffs.csv
;board_build.partitions = no_ota.csv
; 2) A "partitions_custom.csv" in the root of project directory
;board_build.partitions = partitions_custom.csv
; personal tasks, PlatformIO -> PROJECT TASKS -> Custom
extra_scripts = add_tasks.py

[env:release]
build_flags = 
  ${env.build_flags}
lib_deps = 
  ${env.lib_deps}

[env:debug]
;platform_packages = platformio/tool-openocd-esp32@^2.1100.211028
;platform_packages = platformio/tool-openocd-esp32@2.1200.20250707
build_type = debug
build_flags = 
  ${env.build_flags}
lib_deps = 
  ${env.lib_deps}
debug_tool = esp-prog
debug_init_break = tbreak setup
